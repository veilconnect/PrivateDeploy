name: Mobile - Android CI Artifact

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build-android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  build-gomobile:
    name: Build Go Mobile AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mobile/gomobile/go.mod

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260312152759-81488f6aeb60
          gomobile init

      - name: Build AAR
        run: |
          cd gomobile
          chmod +x build-android.sh
          ./build-android.sh

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vpncore-aar
          # Artifact actions ignore `working-directory: mobile`; the AAR is
          # produced under mobile/ by build-android.sh (OUTPUT_DIR=../android/app/libs).
          path: mobile/android/app/libs/vpncore.aar
          retention-days: 7

  build-apk-debug:
    # This branch/PR workflow intentionally emits only a short-lived debug
    # artifact. Signed APK/AAB stable artifacts are produced exclusively by
    # mobile-release.yml, whose missing-secret policy is fail-closed.
    name: Build Android APK (Debug CI only)
    runs-on: ubuntu-latest
    needs: build-gomobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: vpncore-aar
          path: mobile/android/app/libs/

      - name: Get dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
